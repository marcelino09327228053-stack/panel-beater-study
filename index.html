<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Beater Study</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div><h1>Panel Beater Study</h1><p>Car Body Parts</p></div><button id="addBtn" class="primary">+ Add New Part</button></header>
<main class="app-shell">
<aside class="sidebar"><input id="searchInput" class="search" type="search" placeholder="Search part..."><div id="partsList" class="parts-list"></div></aside>
<section class="content">
<div id="emptyState" class="empty-state"><h2>Select a part</h2><p>Choose a car body part from the list.</p></div>
<article id="detailCard" class="detail-card hidden"><div class="detail-body">
<h2 id="detailName"></h2>
<label for="mainPartName">Part Name</label><input id="mainPartName" placeholder="Part name">
<label for="mainImageUrl">Image Website Link</label><input id="mainImageUrl" placeholder="Paste your image link here">
<a id="imagesBtn" class="images-btn link-button" target="_blank" rel="noopener noreferrer">🖼 View Images</a>
<label for="mainYoutubeUrl">YouTube Link</label><input id="mainYoutubeUrl" placeholder="Paste your YouTube link here">
<div id="videoPreview" class="video-preview hidden"><img id="videoThumb" alt="YouTube video preview"><span>▶</span></div>
<a id="watchBtn" class="watch-btn link-button" target="_blank" rel="noopener noreferrer">▶ Watch Video</a>
<label for="notesArea">Notes</label><textarea id="notesArea" rows="7" placeholder="Write your study notes here..."></textarea>
<button id="saveChangesBtn" class="primary full">💾 Save Changes</button>
<button id="deletePartBtn" class="danger full danger-space">Delete Part</button>
</div></article>
</section></main>
<script src="app.js"></script></body></html>
